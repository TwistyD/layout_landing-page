<!-- Region head -->
<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Nothing Landing Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion -->

  <body class="page__body">
    <header class="header">
      <div class="top-bar header__top-bar">
        <a href="#" class="top-bar__logo">
          <img src="src/images/logo.png" alt="Nothing logo">
        </a>

        <div class="top-bar__icons">
          <a href="#" class="icon icon--phone"></a>
          <a href="#menu" class="icon icon--menu"></a>
        </div>
      </div>

      <div class="header__bottom">
        <h1 class="header__title">
          Bring joy back<br>to the everyday
        </h1>
      </div>
    </header>

    <aside class="menu page__menu" id="menu">
      <div class="top-bar menu__top-bar">
        <a href="#" class="top-bar__logo">
          <img src="src/images/logo.png" alt="Nothing logo">
        </a>
        <a href="#" class="icon icon--close"></a>
      </div>

      <div class="menu__content">
        <nav class="nav menu__nav">
          <ul class="nav__list">
            <li class="nav__item"><a class="nav__link" href="#products">Products</a></li>
            <li class="nav__item"><a class="nav__link" href="#store">Store</a></li>
            <li class="nav__item"><a class="nav__link" href="#login">Login</a></li>
            <li class="nav__item"><a class="nav__link" href="#cart">Cart(0)</a></li>
          </ul>
        </nav>

        <a href="tel:+12345555555" class="menu__phone-number">+1 234 5555-55-55</a>
        <a href="tel:+12345555555" class="menu__call-to-order">CALL TO ORDER</a>
      </div>
    </aside>

    <main class="main">
      <section class="recommended main__section">
        <h2 class="recommended__title">Recommended</h2>
      </section>

      <section class="category main__section">
        <h2 class="category__title">Browse Nothing products by category</h2>
      </section>

      <section class="about main__section">
        <h2 class="about__title">About us</h2>
      </section>

      <section class="contacts main__section">
        <h2 class="contacts__title">Contact us</h2>
      </section>
    </main>
  </body>
</html>
